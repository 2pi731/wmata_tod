<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Development Around Washington Metro</title>


  <!-- ======================================================
       LEAFLET
       ====================================================== -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>


  <!-- ======================================================
       STYLES
       ====================================================== -->

  <style>

    :root {
      --background: #F7F3EC;
      --text: #282522;
      --secondary-text: #756D66;
      --border: #D8D1C8;
      --station-outline: #3F3A35;
      --water: #DCE6E5;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }


    body {
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: var(--background);
      color: var(--text);
    }


    #map {
      width: 100%;
      height: 100vh;
      background: var(--background);
    }


    /* ======================================================
       POPUPS
       ====================================================== */

    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      background: var(--background);
    }


    .leaflet-popup-content-wrapper {
      border-radius: 6px;

      box-shadow:
        0 2px 12px rgba(40, 37, 34, 0.16);
    }


    .leaflet-popup-content {
      width: 250px !important;

      margin:
        15px
        17px;

      color: var(--text);
    }


    .station-popup-name {
      margin-bottom: 2px;

      color: var(--text);

      font-size: 17px;
      font-weight: 700;
      line-height: 1.2;
    }


    .station-popup-state {
      color: var(--secondary-text);

      font-size: 12px;
      line-height: 1.4;
    }


    .popup-section {
      margin-top: 12px;
      padding-top: 9px;

      border-top:
        1px solid
        var(--border);
    }


    .popup-section-title {
      margin-bottom: 5px;

      color: var(--secondary-text);

      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.07em;
      line-height: 1.3;

      text-transform: uppercase;
    }


    .popup-stat {
      display: flex;

      justify-content: space-between;
      align-items: baseline;

      gap: 18px;

      padding: 2px 0;

      font-size: 13px;
      line-height: 1.35;
    }


    .popup-stat span {
      color: #514B46;
    }


    .popup-stat strong {
      color: var(--text);

      font-weight: 700;

      text-align: right;
    }


    .popup-stat-total {
      margin-top: 3px;
      padding-top: 5px;

      border-top:
        1px dotted
        var(--border);
    }


    .popup-note {
      margin-top: 10px;

      color: #8A8179;

      font-size: 10px;
      line-height: 1.35;
    }


    /* ======================================================
       LEGEND
       ====================================================== */

    .ridership-legend {
      padding:
        10px
        12px;

      background:
        rgba(247, 243, 236, 0.94);

      border:
        1px solid
        rgba(216, 209, 200, 0.9);

      border-radius:
        5px;

      box-shadow:
        0 1px 5px
        rgba(40, 37, 34, 0.08);

      color: var(--text);

      font-size: 11px;
      line-height: 1.3;
    }


    .ridership-legend-title {
      margin-bottom: 8px;

      font-size: 11px;
      font-weight: 700;
    }


    .legend-row {
      display: flex;

      align-items: center;

      gap: 8px;

      margin: 5px 0;
    }


    .legend-circle {
      display: inline-block;

      flex: 0 0 auto;

      box-sizing: border-box;

      background:
        var(--background);

      border:
        1.5px solid
        var(--station-outline);

      border-radius: 50%;
    }


    .legend-circle-small {
      width: 8px;
      height: 8px;
    }


    .legend-circle-medium {
      width: 14px;
      height: 14px;
    }


    .legend-circle-large {
      width: 20px;
      height: 20px;
    }


    /* ======================================================
       LEAFLET CONTROLS
       ====================================================== */

    .leaflet-control-zoom a {
      color: var(--station-outline);
    }


    .leaflet-container {
      background: var(--background);
    }


    .leaflet-control-attribution {
      background:
        rgba(247, 243, 236, 0.75) !important;

      color: #8A8179;

      font-size: 9px;
    }

  </style>

</head>


<body>

  <div id="map"></div>


  <script>


    // ======================================================
    // MAP
    // ======================================================

    const map = L.map(
      "map",
      {
        zoomControl: true,
        attributionControl: true,
        preferCanvas: true
      }
    ).setView(
      [38.92, -77.04],
      10
    );


    // ======================================================
    // PANES
    // ======================================================

    map.createPane(
      "waterPane"
    );

    map.getPane(
      "waterPane"
    ).style.zIndex = 200;


    map.createPane(
      "metroPane"
    );

    map.getPane(
      "metroPane"
    ).style.zIndex = 400;


    map.createPane(
      "stationPane"
    );

    map.getPane(
      "stationPane"
    ).style.zIndex = 600;



    // ======================================================
    // HELPER FUNCTIONS
    // ======================================================

    function formatNumber(value) {

      const number =
        Number(value);


      if (
        value === null ||
        value === undefined ||
        value === "" ||
        Number.isNaN(number)
      ) {

        return "—";

      }


      return number.toLocaleString(
        "en-US",
        {
          maximumFractionDigits: 0
        }
      );

    }


    function formatPercent(value) {

      const number =
        Number(value);


      if (
        value === null ||
        value === undefined ||
        value === "" ||
        Number.isNaN(number)
      ) {

        return "—";

      }


      return (
        number.toLocaleString(
          "en-US",
          {
            minimumFractionDigits: 1,
            maximumFractionDigits: 1
          }
        ) + "%"
      );

    }


    function ridershipRadius(entries) {

      const number =
        Number(entries) || 0;


      // Square-root scaling.
      //
      // Approximately:
      //
      // 1,000 entries  -> ~4.7 px
      // 5,000 entries  -> ~7.6 px
      // 10,000 entries -> ~9.6 px
      // busiest        -> max 11 px

      return Math.max(
        4,
        Math.min(
          11,
          2.5 +
          Math.sqrt(number) / 14
        )
      );

    }



    // ======================================================
    // NHD WATER
    // ======================================================

    fetch(
      "water_nhd.geojson"
    )

      .then(
        response => {

          if (!response.ok) {

            throw new Error(
              "Could not load water_nhd.geojson"
            );

          }

          return response.json();

        }
      )


      .then(
        data => {

          L.geoJSON(
            data,
            {

              pane:
                "waterPane",


              style: function() {

                return {

                  fillColor:
                    "#DCE6E5",

                  fillOpacity:
                    0.9,

                  color:
                    "#DCE6E5",

                  weight:
                    0.5,

                  opacity:
                    0.9

                };

              }

            }
          ).addTo(
            map
          );


          console.log(
            "NHD water features loaded:",
            data.features.length
          );
