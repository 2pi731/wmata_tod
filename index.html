<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Development Around Washington Metro</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#F7F3EC;--text:#282522;--muted:#756D66;--border:#D8D1C8;--accent:#C8643B;--purple:#7A3E98}
html,body,#map{width:100%;height:100%;margin:0}body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}#map{background:var(--bg)}
.map-intro{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:1000;width:420px;max-width:calc(100vw - 620px);padding:10px 16px;background:rgba(247,243,236,.95);border:1px solid var(--border);border-radius:6px;box-shadow:0 2px 10px rgba(40,37,34,.08);text-align:center;pointer-events:none}.map-intro b{font-size:16px}.map-intro div{margin-top:5px;color:var(--muted);font-size:11px;line-height:1.35}
.box{min-width:190px;padding:11px 12px;background:rgba(247,243,236,.97);border:1px solid var(--border);border-radius:6px;box-shadow:0 2px 10px rgba(40,37,34,.1)}.title{margin-bottom:7px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}.desc{margin-top:7px;color:var(--muted);font-size:10px;line-height:1.35}.select{width:100%;padding:6px 7px;border:1px solid #CFC7BE;border-radius:4px;background:#fff;color:var(--text)}
.radius{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.radius button{padding:6px 4px;border:1px solid #CFC7BE;border-radius:4px;background:white;color:#514B46;cursor:pointer}.radius button.active{background:var(--accent);border-color:var(--accent);color:white;font-weight:700}.selected-name{font-size:12px;font-weight:700;margin-bottom:8px}
.station-panel{width:265px;max-height:calc(100vh - 40px);overflow:auto;margin-left:42px!important;padding:15px 17px;background:rgba(247,243,236,.98);border:1px solid var(--border);border-radius:6px;box-shadow:0 2px 12px rgba(40,37,34,.14)}.station-name{font-size:17px;font-weight:700}.station-state{color:var(--muted);font-size:12px;margin-top:2px}.section{margin-top:12px;padding-top:9px;border-top:1px solid var(--border)}.section-title{margin-bottom:5px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}.stat{display:flex;justify-content:space-between;gap:18px;padding:2px 0;font-size:13px}.stat span{color:#514B46}.stat strong{text-align:right}.total{margin-top:3px;padding-top:5px;border-top:1px dotted var(--border)}.note{margin-top:10px;color:#8A8179;font-size:10px;line-height:1.35}
.legend{padding:10px 12px;background:rgba(247,243,236,.96);border:1px solid var(--border);border-radius:6px;box-shadow:0 2px 8px rgba(40,37,34,.08);font-size:10px}.legend-title{font-size:11px;font-weight:700;margin-bottom:7px}.legend-row{display:flex;align-items:center;gap:8px;margin:5px 0}.swatch{display:inline-block;width:28px}.metro-swatch{height:4px;border-radius:2px;background:linear-gradient(to right,#BF0D3E 0 16%,#ED8B00 16% 32%,#FFD100 32% 48%,#00B140 48% 64%,#009CDE 64% 80%,#919D9D 80%)}.purple-swatch{height:0;border-top:2px dashed rgba(122,62,152,.7)}.road-swatch{height:0;border-top:1px solid #B8B1A9}.county-swatch{height:0;border-top:1px dashed #AEA59C}.water-swatch{height:7px;background:#DCE6E5}.circlewrap{width:32px;height:28px;display:flex;align-items:center;justify-content:center}.circle{box-sizing:border-box;border:1.5px solid #3F3A35;border-radius:50%;background:var(--bg)}
.jlabel{color:#988F87;font-size:11px;font-weight:600;letter-spacing:.1em;white-space:nowrap;text-shadow:0 1px var(--bg),1px 0 var(--bg),0 -1px var(--bg),-1px 0 var(--bg);pointer-events:none}.loader{display:none;position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:1000;padding:7px 10px;background:rgba(247,243,236,.96);border:1px solid var(--border);border-radius:4px;color:var(--muted);font-size:11px}
@media(max-width:700px){.map-intro{width:calc(100vw - 120px);max-width:360px}.map-intro div{display:none}.box{min-width:160px;max-width:175px}.desc{display:none}}
</style>
</head>
<body>
<div id="map"></div>
<div class="map-intro"><b>Explore the Metro</b><div>Click any station to see ridership, nearby residents and jobs, and building coverage. Change the radius or metric to compare places across the system.</div></div>
<div id="loader" class="loader">Loading building footprints…</div>
<script>
const map=L.map('map',{zoomControl:true,preferCanvas:false}).setView([38.92,-77.04],10);
const Z={water:200,county:250,road:290,highway:320,building:340,buffer:370,label:390,purple:405,metro:420,station:600};
Object.entries(Z).forEach(([n,z])=>{map.createPane(n+'Pane');map.getPane(n+'Pane').style.zIndex=z});map.getPane('labelPane').style.pointerEvents='none';
// One shared SVG renderer keeps both Metrorail and Purple Line stations clickable.
// Separate SVG panes can place a transparent SVG surface above the other stations and steal pointer events.
const stationRenderer=L.svg({pane:'stationPane',padding:.5}).addTo(map);
const BUILDING_MIN_ZOOM=15, SECONDARY_MIN_ZOOM=13, LOCAL_MIN_ZOOM=15, COUNTY_MAX_ZOOM=13, LABEL_MAX_ZOOM=12;
let activeMetric='ridership',activeRadius='quarter',selected=null,stationLayer=null,purpleStationLayer=null,sizeLegend=null;
let buffers={metro:{},purple:{}},buildingIndex=null;const buildingCache=new Map(),buildingLayers=new Map();let buildingTimer=null;
const metrics={ridership:{label:'Metrorail use',field:'avg_daily_entries_7day',desc:'Average daily station entries',vals:[1000,3000,6000,9000,12000,15000]},activity:{label:'Residents + jobs',field:'population_jobs_quarter',desc:'Residents and jobs within ¼ mile',vals:[2000,5000,10000,20000,35000,50000]},population:{label:'Residents',field:'population_quarter',desc:'Residents within ¼ mile',vals:[1000,3000,6000,9000,12000,15000]},jobs:{label:'Jobs',field:'jobs_quarter',desc:'Jobs within ¼ mile',vals:[1000,5000,10000,20000,35000,50000]},housing:{label:'Housing units',field:'housing_units_quarter',desc:'Housing units within ¼ mile',vals:[500,1000,2000,3000,4000,5000]},coverage:{label:'Building coverage',field:'building_coverage_pct_eighth',desc:'Land covered by buildings within ⅛ mile',vals:[10,20,30,40,50],percent:true}};
let stationValues={};const fmt=v=>(v===null||v===undefined||v===''||Number.isNaN(Number(v)))?'—':Number(v).toLocaleString('en-US',{maximumFractionDigits:0});const pct=v=>(v===null||v===undefined||v===''||Number.isNaN(Number(v)))?'—':Number(v).toFixed(1)+'%';
function radiusFor(v,key){const a=stationValues[key]||[],m=a.length?Math.max(...a):0;if(!m)return 4;return 3.5+Math.sqrt(Math.max(0,(Number(v)||0)/m))*10.5}
function infoHTML(p,purple=false){const name=purple?p.station_name:p.Station_Name,state=purple?'Maryland':(p.State||'');return `<div class="station-name">${name}</div><div class="station-state">${state}</div><div class="section"><div class="section-title">${purple?'Purple Line':'Metrorail use'}</div>${purple?'<div class="stat"><span>Status</span><strong>Under construction</strong></div><div class="stat"><span>Ridership</span><strong>Not yet in service</strong></div>':`<div class="stat"><span>Average daily entries</span><strong>${fmt(p.avg_daily_entries_7day)}</strong></div><div class="stat"><span>Average weekday entries</span><strong>${fmt(p.avg_daily_entries_weekday)}</strong></div>`}</div><div class="section"><div class="section-title">Within ¼ mile</div>${stats(p,'quarter')}</div><div class="section"><div class="section-title">Within ½ mile</div>${stats(p,'half')}</div><div class="section"><div class="section-title">Building coverage</div><div class="stat"><span>⅛ mile</span><strong>${pct(p.building_coverage_pct_eighth)}</strong></div><div class="stat"><span>¼ mile</span><strong>${pct(p.building_coverage_pct_quarter)}</strong></div><div class="stat"><span>½ mile</span><strong>${pct(p.building_coverage_pct_half)}</strong></div></div><div class="note">${purple?'Purple Line service is under construction, so observed station ridership is not yet available. ':''}Population: 2020 Census. Jobs: 2024 LEHD LODES.</div>`}
function stats(p,s){return `<div class="stat"><span>Residents</span><strong>${fmt(p['population_'+s])}</strong></div><div class="stat"><span>Jobs</span><strong>${fmt(p['jobs_'+s])}</strong></div><div class="stat total"><span>Residents + jobs</span><strong>${fmt(p['population_jobs_'+s])}</strong></div><div class="stat"><span>Housing units</span><strong>${fmt(p['housing_units_'+s])}</strong></div>`}
const panelCtl=L.control({position:'topleft'});panelCtl.onAdd=()=>{const d=L.DomUtil.create('div','station-panel');d.id='station-panel';d.style.display='none';L.DomEvent.disableClickPropagation(d);return d};panelCtl.addTo(map);
const metricCtl=L.control({position:'topright'});metricCtl.onAdd=()=>{const d=L.DomUtil.create('div','box');d.innerHTML=`<div class="title">Size stations by</div><select id="metric" class="select">${Object.entries(metrics).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('')}</select><div id="metricdesc" class="desc">${metrics[activeMetric].desc}</div>`;L.DomEvent.disableClickPropagation(d);return d};metricCtl.addTo(map);
const radiusCtl=L.control({position:'topright'});radiusCtl.onAdd=()=>{const d=L.DomUtil.create('div','box');d.innerHTML=`<div class="title">Selected station area</div><div id="selectedname" class="selected-name">Click a station</div><div class="radius"><button data-r="eighth">⅛</button><button class="active" data-r="quarter">¼</button><button data-r="half">½</button><button data-r="none">None</button></div><div class="desc">Radius in miles. Buildings inside the active station area are highlighted.</div>`;L.DomEvent.disableClickPropagation(d);return d};radiusCtl.addTo(map);
document.querySelectorAll('.radius button').forEach(b=>b.onclick=()=>{activeRadius=b.dataset.r;document.querySelectorAll('.radius button').forEach(x=>x.classList.toggle('active',x===b));drawBuffer()});
function selectStation(p,latlng,system){selected={system,id:system==='purple'?p.purple_station_id:(p.station_id??p.Station_ID??p.STATION_ID??p.stationid),name:system==='purple'?p.station_name:p.Station_Name,p};document.getElementById('selectedname').textContent=selected.name;const pan=document.getElementById('station-panel');pan.innerHTML=infoHTML(p,system==='purple');pan.style.display='block';drawBuffer();if(map.getZoom()<BUILDING_MIN_ZOOM)map.flyTo(latlng,BUILDING_MIN_ZOOM,{duration:.65});scheduleBuildings()}
let bufferLayer=null,bufferFeature=null;function findBuffer(){if(!selected||activeRadius==='none')return null;const data=buffers[selected.system][activeRadius];if(!data)return null;return data.features.find(f=>String(selected.system==='purple'?f.properties.purple_station_id:(f.properties.station_id??f.properties.Station_ID??f.properties.STATION_ID??f.properties.stationid))===String(selected.id))||null}
function drawBuffer(){if(bufferLayer)map.removeLayer(bufferLayer);bufferLayer=null;bufferFeature=findBuffer();if(bufferFeature){bufferLayer=L.geoJSON(bufferFeature,{pane:'bufferPane',interactive:false,style:{fillColor:'#C8643B',fillOpacity:.075,color:'#C8643B',weight:2,opacity:.9,dashArray:'5,4'}}).addTo(map)}refreshBuildings()}
function pinring(pt,ring){let x=pt[0],y=pt[1],inside=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){let xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];if(((yi>y)!=(yj>y))&&(x<((xj-xi)*(y-yi))/(yj-yi)+xi))inside=!inside}return inside}function pinpoly(pt,c){if(!c?.length||!pinring(pt,c[0]))return false;for(let i=1;i<c.length;i++)if(pinring(pt,c[i]))return false;return true}function inside(pt,f){if(!f?.geometry)return false;let g=f.geometry;if(g.type==='Polygon')return pinpoly(pt,g.coordinates);if(g.type==='MultiPolygon')return g.coordinates.some(p=>pinpoly(pt,p));return false}
function styleBuilding(layer){let sel=false;if(bufferFeature){const c=layer.getBounds().getCenter();sel=inside([c.lng,c.lat],bufferFeature)}return sel?{fillColor:'#C8643B',fillOpacity:.60,color:'#A94E2D',weight:.45,opacity:.65}:{fillColor:'#8F877F',fillOpacity:.28,color:'#8F877F',weight:0,opacity:0}}
function refreshBuildings(){buildingLayers.forEach(gr=>gr.eachLayer(l=>l.setStyle(styleBuilding(l))))}function bboxHit(a,b){return !(a.getWest()>b.getEast()||a.getEast()<b.getWest()||a.getSouth()>b.getNorth()||a.getNorth()<b.getSouth())}
fetch('building_tiles_index.geojson').then(r=>r.json()).then(d=>{buildingIndex=d.features.map(f=>({filename:f.properties.filename,bounds:L.geoJSON(f).getBounds()}));scheduleBuildings()});async function scheduleBuildings(){clearTimeout(buildingTimer);buildingTimer=setTimeout(updateBuildings,180)}async function updateBuildings(){if(!buildingIndex)return;if(map.getZoom()<BUILDING_MIN_ZOOM){buildingLayers.forEach(l=>map.removeLayer(l));buildingLayers.clear();return}const bounds=map.getBounds().pad(.12),need=buildingIndex.filter(t=>bboxHit(bounds,t.bounds)),names=new Set(need.map(x=>x.filename));buildingLayers.forEach((l,n)=>{if(!names.has(n)){map.removeLayer(l);buildingLayers.delete(n)}});document.getElementById('loader').style.display='block';for(const t of need){if(buildingLayers.has(t.filename))continue;let data=buildingCache.get(t.filename);if(!data){try{data=await fetch('buildings/'+t.filename).then(r=>r.json());buildingCache.set(t.filename,data)}catch(e){console.error(e);continue}}const gr=L.geoJSON(data,{pane:'buildingPane',interactive:false,onEachFeature:(f,l)=>l.setStyle(styleBuilding(l))}).addTo(map);buildingLayers.set(t.filename,gr)}document.getElementById('loader').style.display='none';refreshBuildings()}
Promise.all(['buffers_eighth.geojson','buffers_quarter.geojson','buffers_half.geojson','purple_buffers_eighth.geojson','purple_buffers_quarter.geojson','purple_buffers_half.geojson'].map(x=>fetch(x).then(r=>r.json()))).then(a=>{[buffers.metro.eighth,buffers.metro.quarter,buffers.metro.half,buffers.purple.eighth,buffers.purple.quarter,buffers.purple.half]=a}).catch(e=>console.error('Buffer load',e));
// Context layers
fetch('water_nhd.geojson').then(r=>r.json()).then(d=>L.geoJSON(d,{pane:'waterPane',interactive:false,style:{fillColor:'#DCE6E5',fillOpacity:.9,color:'#DCE6E5',weight:.5}}).addTo(map));
let county,secondary,local;fetch('county_boundaries.geojson').then(r=>r.json()).then(d=>{county=L.geoJSON(d,{pane:'countyPane',interactive:false,style:{color:'#AEA59C',weight:1,opacity:.6,dashArray:'4,5'}});context()});fetch('minor_roads.geojson').then(r=>r.json()).then(d=>{secondary=L.geoJSON(d,{pane:'roadPane',filter:f=>f.properties.MTFCC==='S1200',interactive:false,style:{color:'#CEC7BF',weight:.9,opacity:.68}});local=L.geoJSON(d,{pane:'roadPane',filter:f=>f.properties.MTFCC==='S1400',interactive:false,style:{color:'#DDD7D0',weight:.55,opacity:.62}});context()});fetch('major_highways.geojson').then(r=>r.json()).then(d=>L.geoJSON(d,{pane:'highwayPane',interactive:false,style:{color:'#B8B1A9',weight:1.25,opacity:.5}}).addTo(map));
const jl=L.layerGroup(),places=[['LOUDOUN',39.005,-77.50],['FAIRFAX',38.885,-77.33],['MONTGOMERY',39.09,-77.14],["PRINCE GEORGE'S",38.94,-76.84],['ARLINGTON',38.89,-77.16],['ALEXANDRIA',38.79,-77.105],['DISTRICT OF COLUMBIA',38.925,-76.985]];places.forEach(([n,lat,lng])=>jl.addLayer(L.marker([lat,lng],{pane:'labelPane',interactive:false,icon:L.divIcon({className:'',html:`<div class="jlabel">${n}</div>`})})));function context(){let z=map.getZoom();[[county,z<=COUNTY_MAX_ZOOM],[secondary,z>=SECONDARY_MIN_ZOOM],[local,z>=LOCAL_MIN_ZOOM],[jl,z<=LABEL_MAX_ZOOM]].forEach(([l,on])=>{if(!l)return;if(on&&!map.hasLayer(l))l.addTo(map);if(!on&&map.hasLayer(l))map.removeLayer(l)})}jl.addTo(map);
// Rail lines
const lineColors={Red:'#BF0D3E',Blue:'#009CDE',Orange:'#ED8B00',Silver:'#919D9D',Green:'#00B140',Yellow:'#FFD100'};fetch('purple_line.geojson').then(r=>r.json()).then(d=>L.geoJSON(d,{pane:'purplePane',interactive:false,style:{color:'#7A3E98',weight:3,opacity:.62,dashArray:'7,5'}}).addTo(map));fetch('metro_lines.geojson').then(r=>r.json()).then(d=>L.geoJSON(d,{pane:'metroPane',interactive:false,style:f=>({color:lineColors[f.properties.LINE||f.properties.Line||f.properties.NAME||f.properties.Name]||'#77736E',weight:4,opacity:.9})}).addTo(map));
// Purple stations: shared station SVG renderer + explicit hover/click listeners.
fetch('purple_line_stations.geojson').then(r=>r.json()).then(data=>{purpleStationLayer=L.geoJSON(data,{pane:'stationPane',renderer:stationRenderer,filter:f=>![true,'true',1,'1'].includes(f.properties.is_metrorail_interchange),pointToLayer:(f,ll)=>L.circleMarker(ll,{pane:'stationPane',renderer:stationRenderer,interactive:true,bubblingMouseEvents:false,radius:5,fillColor:'#F7F3EC',fillOpacity:.88,color:'#7A3E98',opacity:.9,weight:1.5}),onEachFeature:(f,l)=>{const p=f.properties;l.bindTooltip(`<strong>${p.station_name}</strong><br>Purple Line<br>Under construction`,{direction:'top'});l.on('mouseover',function(){this.setStyle({color:'#C8643B',weight:2.5,fillOpacity:1});this.setRadius(6)});l.on('mouseout',function(){this.setStyle({color:'#7A3E98',weight:1.5,fillOpacity:.88});this.setRadius(5)});l.on('click',e=>selectStation(p,e.latlng,'purple'))}}).addTo(map)}).catch(e=>console.error('Purple stations',e));
// Metro stations
fetch('stations.geojson').then(r=>r.json()).then(data=>{Object.keys(metrics).forEach(k=>{stationValues[k]=data.features.map(f=>Number(f.properties[metrics[k].field])).filter(Number.isFinite)});stationLayer=L.geoJSON(data,{pane:'stationPane',renderer:stationRenderer,pointToLayer:(f,ll)=>L.circleMarker(ll,{pane:'stationPane',renderer:stationRenderer,radius:radiusFor(f.properties[metrics[activeMetric].field],activeMetric),fillColor:'#F7F3EC',color:'#3F3A35',weight:1.5,fillOpacity:.96}),onEachFeature:(f,l)=>{const p=f.properties;const name=p.Station_Name||p.station_name||'Metrorail station';const rawLines=p.LINE||p.Line||p.LINES||p.lines||'';const lineText=String(rawLines).trim();const norm=name.toLowerCase();const purpleInterchange=(norm.includes('bethesda')||norm.includes('silver spring')||norm.includes('college park')||norm.includes('new carrollton'));let service='';if(lineText){const cleaned=lineText.replace(/[,;|/]+/g,' · ').replace(/\s+/g,' ').trim();service=cleaned.toLowerCase().includes('line')?cleaned:(cleaned+(cleaned.includes(' · ')?' Lines':' Line'));}let tip=`<strong>${name}</strong>`+(service?`<br>${service}`:'');if(purpleInterchange)tip+=`<br>Purple Line<br>Under construction`;l.bindTooltip(tip,{direction:'top',offset:[0,-6],opacity:.95});l.on('mouseover',function(){this.setStyle({color:'#C8643B',weight:2.5})});l.on('mouseout',function(){this.setStyle({color:'#3F3A35',weight:1.5})});l.on('click',e=>selectStation(p,e.latlng,'metro'))}}).addTo(map);map.fitBounds(stationLayer.getBounds(),{padding:[30,30]});updateLegend()});
document.getElementById('metric').onchange=e=>{activeMetric=e.target.value;document.getElementById('metricdesc').textContent=metrics[activeMetric].desc;stationLayer?.eachLayer(l=>l.setRadius(radiusFor(l.feature.properties[metrics[activeMetric].field],activeMetric)));updateLegend()};
function updateLegend(){if(sizeLegend)map.removeControl(sizeLegend);sizeLegend=L.control({position:'bottomright'});sizeLegend.onAdd=()=>{let d=L.DomUtil.create('div','legend'),m=metrics[activeMetric];d.innerHTML=`<div class="legend-title">${m.label}</div>`+m.vals.map(v=>{let dia=radiusFor(v,activeMetric)*2;return `<div class="legend-row"><div class="circlewrap"><span class="circle" style="width:${dia}px;height:${dia}px"></span></div><span>${m.percent?pct(v):fmt(v)}</span></div>`}).join('');return d};sizeLegend.addTo(map)}
const lg=L.control({position:'bottomright'});lg.onAdd=()=>{let d=L.DomUtil.create('div','legend');d.innerHTML='<div class="legend-title">Map</div><div class="legend-row"><span class="swatch metro-swatch"></span>Metrorail</div><div class="legend-row"><span class="swatch purple-swatch"></span>Purple Line under construction</div><div class="legend-row"><span class="swatch road-swatch"></span>Major highway</div><div class="legend-row"><span class="swatch county-swatch"></span>County / city boundary</div><div class="legend-row"><span class="swatch water-swatch"></span>Water</div>';return d};lg.addTo(map);
map.on('zoomend',()=>{context();scheduleBuildings()});map.on('moveend',scheduleBuildings);
</script>
</body>
</html>
