<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Development Around Washington Metro</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>


  <style>

    :root {
      --background: #F7F3EC;
      --text: #282522;
      --secondary-text: #756D66;
      --border: #D8D1C8;
      --station-outline: #3F3A35;
      --accent: #C8643B;

      --water: #DCE6E5;

      --county: #AEA59C;

      --highway: #B5ADA5;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }


    body {
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        var(--background);

      color:
        var(--text);
    }


    #map {
      width: 100%;
      height: 100vh;

      background:
        var(--background);
    }


    /* ======================================================
       METRIC SELECTOR
       ====================================================== */

    .metric-control {
      min-width: 190px;

      padding:
        11px
        12px;

      background:
        rgba(247, 243, 236, 0.96);

      border:
        1px solid
        rgba(216, 209, 200, 0.95);

      border-radius:
        6px;

      box-shadow:
        0 2px 10px
        rgba(40, 37, 34, 0.10);
    }


    .metric-control-title {
      margin-bottom: 7px;

      color:
        var(--secondary-text);

      font-size: 10px;
      font-weight: 700;

      letter-spacing: 0.07em;

      text-transform: uppercase;
    }


    .metric-select {
      width: 100%;

      padding:
        6px 7px;

      background:
        #FFFFFF;

      border:
        1px solid
        #CFC7BE;

      border-radius:
        4px;

      color:
        var(--text);

      font-size:
        13px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      cursor:
        pointer;
    }


    .metric-description {
      max-width: 210px;

      margin-top: 7px;

      color:
        var(--secondary-text);

      font-size: 10px;

      line-height: 1.35;
    }


    /* ======================================================
       POPUPS
       ====================================================== */

    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      background:
        var(--background);
    }


    .leaflet-popup-content-wrapper {
      border-radius: 6px;

      box-shadow:
        0 2px 12px
        rgba(40, 37, 34, 0.16);
    }


    .leaflet-popup-content {
      width: 250px !important;

      margin:
        15px
        17px;

      color:
        var(--text);
    }


    .station-popup-name {
      margin-bottom: 2px;

      color:
        var(--text);

      font-size: 17px;
      font-weight: 700;
      line-height: 1.2;
    }


    .station-popup-state {
      color:
        var(--secondary-text);

      font-size: 12px;

      line-height: 1.4;
    }


    .popup-section {
      margin-top: 12px;

      padding-top: 9px;

      border-top:
        1px solid
        var(--border);
    }


    .popup-section-title {
      margin-bottom: 5px;

      color:
        var(--secondary-text);

      font-size: 10px;
      font-weight: 700;

      letter-spacing: 0.07em;

      line-height: 1.3;

      text-transform: uppercase;
    }


    .popup-stat {
      display: flex;

      justify-content: space-between;

      align-items: baseline;

      gap: 18px;

      padding: 2px 0;

      font-size: 13px;

      line-height: 1.35;
    }


    .popup-stat span {
      color: #514B46;
    }


    .popup-stat strong {
      color:
        var(--text);

      font-weight: 700;

      text-align: right;
    }


    .popup-stat-total {
      margin-top: 3px;

      padding-top: 5px;

      border-top:
        1px dotted
        var(--border);
    }


    .popup-note {
      margin-top: 10px;

      color: #8A8179;

      font-size: 10px;

      line-height: 1.35;
    }


    /* ======================================================
       SIZE LEGEND
       ====================================================== */

    .size-legend {
      min-width: 145px;

      padding:
        10px
        12px;

      background:
        rgba(247, 243, 236, 0.95);

      border:
        1px solid
        rgba(216, 209, 200, 0.95);

      border-radius: 6px;

      box-shadow:
        0 2px 8px
        rgba(40, 37, 34, 0.08);

      color:
        var(--text);

      font-size: 11px;

      line-height: 1.3;
    }


    .size-legend-title {
      margin-bottom: 8px;

      font-size: 11px;

      font-weight: 700;
    }


    .size-legend-row {
      display: flex;

      align-items: center;

      gap: 9px;

      min-height: 27px;

      margin: 3px 0;
    }


    .size-legend-circle-wrap {
      display: flex;

      justify-content: center;

      align-items: center;

      width: 32px;

      height: 27px;
    }


    .size-legend-circle {
      display: block;

      box-sizing: border-box;

      background:
        var(--background);

      border:
        1.5px solid
        var(--station-outline);

      border-radius: 50%;
    }


    /* ======================================================
       LEAFLET
       ====================================================== */

    .leaflet-control-zoom a {
      color:
        var(--station-outline);
    }


    .leaflet-container {
      background:
        var(--background);
    }


    .leaflet-control-attribution {
      background:
        rgba(247, 243, 236, 0.75) !important;

      color:
        #8A8179;

      font-size: 9px;
    }


    @media (
      max-width: 700px
    ) {

      .metric-control {
        min-width: 165px;
        max-width: 180px;
      }


      .metric-description {
        display: none;
      }


      .size-legend {
        min-width: 120px;

        padding:
          8px
          9px;
      }

    }

  </style>

</head>


<body>

  <div id="map"></div>


  <script>


    // ======================================================
    // MAP
    // ======================================================

    const map = L.map(
      "map",
      {
        zoomControl: true,
        attributionControl: true,
        preferCanvas: true
      }
    ).setView(
      [38.92, -77.04],
      10
    );


    // ======================================================
    // PANES
    //
    // background
    // water
    // counties
    // highways
    // Metro
    // stations
    // ======================================================

    map.createPane(
      "waterPane"
    );

    map.getPane(
      "waterPane"
    ).style.zIndex =
      200;


    map.createPane(
      "countyPane"
    );

    map.getPane(
      "countyPane"
    ).style.zIndex =
      260;


    map.createPane(
      "highwayPane"
    );

    map.getPane(
      "highwayPane"
    ).style.zIndex =
      320;


    map.createPane(
      "metroPane"
    );

    map.getPane(
      "metroPane"
    ).style.zIndex =
      400;


    map.createPane(
      "stationPane"
    );

    map.getPane(
      "stationPane"
    ).style.zIndex =
      600;



    // ======================================================
    // METRIC CONFIGURATION
    // ======================================================

    const metrics = {

      ridership: {

        label:
          "Metrorail use",

        field:
          "avg_daily_entries_7day",

        description:
          "Average daily station entries",

        legendValues:
          [1000, 5000, 15000],

        format:
          "number"

      },


      activity: {

        label:
          "Residents + jobs",

        field:
          "population_jobs_quarter",

        description:
          "Residents and jobs within ¼ mile",

        legendValues:
          [2000, 10000, 50000],

        format:
          "number"

      },


      population: {

        label:
          "Residents",

        field:
          "population_quarter",

        description:
          "Residents within ¼ mile",

        legendValues:
          [1000, 5000, 15000],

        format:
          "number"

      },


      jobs: {

        label:
          "Jobs",

        field:
          "jobs_quarter",

        description:
          "Jobs within ¼ mile",

        legendValues:
          [1000, 10000, 50000],

        format:
          "number"

      },


      housing: {

        label:
          "Housing units",

        field:
          "housing_units_quarter",

        description:
          "Housing units within ¼ mile",

        legendValues:
          [500, 2000, 5000],

        format:
          "number"

      },


      coverage: {

        label:
          "Building coverage",

        field:
          "building_coverage_pct_eighth",

        description:
          "Land covered by buildings within ⅛ mile",

        legendValues:
          [10, 30, 50],

        format:
          "percent"

      }

    };


    let activeMetric =
      "ridership";


    let stationLayer =
      null;


    let stationValues =
      {};


    let sizeLegend =
      null;



    // ======================================================
    // FORMATTERS
    // ======================================================

    function formatNumber(
      value
    ) {

      const number =
        Number(value);


      if (
        value === null ||
        value === undefined ||
        value === "" ||
        Number.isNaN(number)
      ) {

        return "—";

      }


      return number.toLocaleString(
        "en-US",
        {
          maximumFractionDigits: 0
        }
      );

    }


    function formatPercent(
      value
    ) {

      const number =
        Number(value);


      if (
        value === null ||
        value === undefined ||
        value === "" ||
        Number.isNaN(number)
      ) {

        return "—";

      }


      return (
        number.toLocaleString(
          "en-US",
          {
            minimumFractionDigits: 1,
            maximumFractionDigits: 1
          }
        ) +
        "%"
      );

    }


    function formatMetricValue(
      value,
      metricKey
    ) {

      if (
        metrics[
          metricKey
        ].format ===
        "percent"
      ) {

        return formatPercent(
          value
        );

      }


      return formatNumber(
        value
      );

    }



    // ======================================================
    // DYNAMIC SIZE SCALING
    //
    // Reduced from 20px max to 14px max.
    // ======================================================

    function getRadius(
      value,
      metricKey
    ) {

      const number =
        Number(value) || 0;


      const values =
        stationValues[
          metricKey
        ] || [];


      if (
        values.length === 0
      ) {

        return 4;

      }


      const maxValue =
        Math.max(
          ...values
        );


      if (
        maxValue <= 0
      ) {

        return 4;

      }


      const minRadius =
        3.5;


      const maxRadius =
        14;


      const ratio =
        Math.max(
          0,
          number / maxValue
        );


      return (
        minRadius +
        Math.sqrt(
          ratio
        ) *
        (
          maxRadius -
          minRadius
        )
      );

    }



    // ======================================================
    // NHD WATER
    // ======================================================

    fetch(
      "water_nhd.geojson"
    )

      .then(
        response => {

          if (!response.ok) {

            throw new Error(
              "Could not load water_nhd.geojson"
            );

          }

          return response.json();

        }
      )


      .then(
        data => {

          L.geoJSON(
            data,
            {

              pane:
                "waterPane",


              style: {

                fillColor:
                  "#DCE6E5",

                fillOpacity:
                  0.90,

                color:
                  "#DCE6E5",

                weight:
                  0.5,

                opacity:
                  0.90

              }

            }
          ).addTo(
            map
          );

        }
      );


    // ======================================================
    // COUNTY BOUNDARIES
    // ======================================================

    fetch(
      "county_boundaries.geojson"
    )

      .then(
        response => {

          if (!response.ok) {

            throw new Error(
              "Could not load county_boundaries.geojson"
            );

          }

          return response.json();

        }
      )


      .then(
        data => {

          L.geoJSON(
            data,
            {

              pane:
                "countyPane",


              interactive:
                false,


              style: {

                color:
                  "#AEA59C",

                weight:
                  1,

                opacity:
                  0.62,

                dashArray:
                  "4,5",

                lineCap:
                  "round"

              }

            }
          ).addTo(
            map
          );

        }
      )


      .catch(
        error => {

          console.error(
            "County boundary error:",
            error
          );

        }
      );



    // ======================================================
    // MAJOR HIGHWAYS
    // ======================================================

    fetch(
      "major_highways.geojson"
    )

      .then(
        response => {

          if (!response.ok) {

            throw new Error(
              "Could not load major_highways.geojson"
            );

          }

          return response.json();

        }
      )


      .then(
        data => {

          L.geoJSON(
            data,
            {

              pane:
                "highwayPane",


              interactive:
                false,


              style: {

                color:
                  "#B5ADA5",

                weight:
                  1.5,

                opacity:
                  0.65,

                lineCap:
                  "round",

                lineJoin:
                  "round"

              }

            }
          ).addTo(
            map
          );

        }
      )


      .catch(
        error => {

          console.error(
            "Highway layer error:",
            error
          );

        }
      );



    // ======================================================
    // METRO LINES
    // ======================================================

    const lineColors = {

      "Red":
        "#BF0D3E",

      "Blue":
        "#009CDE",

      "Orange":
        "#ED8B00",

      "Silver":
        "#919D9D",

      "Green":
        "#00B140",

      "Yellow":
        "#FFD100"

    };


    fetch(
      "metro_lines.geojson"
    )

      .then(
        response => {

          if (!response.ok) {

            throw new Error(
              "Could not load metro_lines.geojson"
            );

          }

          return response.json();

        }
      )


      .then(
        data => {

          L.geoJSON(
            data,
            {

              pane:
                "metroPane",


              style: function(
                feature
              ) {

                const properties =
                  feature.properties;


                const lineName =

                  properties.LINE ||

                  properties.Line ||

                  properties.NAME ||

                  properties.Name ||

                  "";


                return {

                  color:
                    lineColors[
                      lineName
                    ] ||
                    "#77736E",

                  weight:
                    4,

                  opacity:
                    0.90,

                  lineCap:
                    "round",

                  lineJoin:
                    "round"

                };

              }

            }
          ).addTo(
            map
          );

        }
      );



    // ======================================================
    // METRIC SELECTOR
    // ======================================================

    const metricControl =
      L.control(
        {
          position:
            "topright"
        }
      );


    metricControl.onAdd =
      function() {

        const div =
          L.DomUtil.create(
            "div",
            "metric-control"
          );


        div.innerHTML =
          `

          <div class="metric-control-title">
            Size stations by
          </div>


          <select
            id="metric-select"
            class="metric-select"
          >

            <option value="ridership">
              Metrorail use
            </option>

            <option value="activity">
              Residents + jobs
            </option>

            <option value="population">
              Residents
            </option>

            <option value="jobs">
              Jobs
            </option>

            <option value="housing">
              Housing units
            </option>

            <option value="coverage">
              Building coverage
            </option>

          </select>


          <div
            id="metric-description"
            class="metric-description"
          >

            ${
              metrics[
                activeMetric
              ].description
            }

          </div>

        `;


        L.DomEvent.disableClickPropagation(
          div
        );


        L.DomEvent.disableScrollPropagation(
          div
        );


        return div;

      };


    metricControl.addTo(
      map
    );



    // ======================================================
    // DYNAMIC LEGEND
    // ======================================================

    function updateLegend() {

      if (
        sizeLegend !== null
      ) {

        map.removeControl(
          sizeLegend
        );

      }


      sizeLegend =
        L.control(
          {
            position:
              "bottomright"
          }
        );


      sizeLegend.onAdd =
        function() {

          const div =
            L.DomUtil.create(
              "div",
              "size-legend"
            );


          const config =
            metrics[
              activeMetric
            ];


          let rows =
            "";


          config.legendValues.forEach(
            value => {

              const diameter =
                getRadius(
                  value,
                  activeMetric
                ) *
                2;


              rows +=
                `

                <div
                  class="size-legend-row"
                >

                  <div
                    class="size-legend-circle-wrap"
                  >

                    <span
                      class="size-legend-circle"
                      style="
                        width:
                          ${diameter}px;

                        height:
                          ${diameter}px;
                      "
                    ></span>

                  </div>


                  <span>

                    ${
                      formatMetricValue(
                        value,
                        activeMetric
                      )
                    }

                  </span>

                </div>

                `;

            }
          );


          div.innerHTML =
            `

            <div class="size-legend-title">
              ${config.label}
            </div>

            ${rows}

            `;


          return div;

        };


      sizeLegend.addTo(
        map
      );

    }



    // ======================================================
    // UPDATE STATION SIZES
    // ======================================================

    function updateStationSizes() {

      if (
        stationLayer === null
      ) {

        return;

      }


      const config =
        metrics[
          activeMetric
        ];


      stationLayer.eachLayer(
        layer => {

          const p =
            layer.feature.properties;


          const value =
            p[
              config.field
            ];


          layer.setRadius(
            getRadius(
              value,
              activeMetric
            )
          );

        }
      );


      const description =
        document.getElementById(
          "metric-description"
        );


      if (
        description
      ) {

        description.textContent =
          config.description;

      }


      updateLegend();

    }



    // ======================================================
    // POPUPS
    // ======================================================

    function buildPopup(
      p
    ) {

      return `

        <div class="station-popup-name">
          ${p.Station_Name}
        </div>

        <div class="station-popup-state">
          ${p.State || ""}
        </div>


        <div class="popup-section">

          <div class="popup-section-title">
            Metrorail use
          </div>


          <div class="popup-stat">

            <span>
              Average daily entries
            </span>

            <strong>
              ${
                formatNumber(
                  p.avg_daily_entries_7day
                )
              }
            </strong>

          </div>


          <div class="popup-stat">

            <span>
              Average weekday entries
            </span>

            <strong>
              ${
                formatNumber(
                  p.avg_daily_entries_weekday
                )
              }
            </strong>

          </div>

        </div>


        <div class="popup-section">

          <div class="popup-section-title">
            Within ¼ mile
          </div>


          <div class="popup-stat">

            <span>
              Residents
            </span>

            <strong>
              ${
                formatNumber(
                  p.population_quarter
                )
              }
            </strong>

          </div>


          <div class="popup-stat">

            <span>
              Jobs
            </span>

            <strong>
              ${
                formatNumber(
                  p.jobs_quarter
                )
              }
            </strong>

          </div>


          <div
            class="
              popup-stat
              popup-stat-total
            "
          >

            <span>
              Residents + jobs
            </span>

            <strong>
              ${
                formatNumber(
                  p.population_jobs_quarter
                )
              }
            </strong>

          </div>


          <div class="popup-stat">

            <span>
              Housing units
            </span>

            <strong>
              ${
                formatNumber(
                  p.housing_units_quarter
                )
              }
            </strong>

          </div>

        </div>


        <div class="popup-section">

          <div class="popup-section-title">
            Within ½ mile
          </div>


          <div class="popup-stat">

            <span>
              Residents
            </span>

            <strong>
              ${
                formatNumber(
                  p.population_half
                )
              }
            </strong>

          </div>


          <div class="popup-stat">

            <span>
              Jobs
            </span>

            <strong>
              ${
                formatNumber(
                  p.jobs_half
                )
              }
            </strong>

          </div>


          <div
            class="
              popup-stat
              popup-stat-total
            "
          >

            <span>
              Residents + jobs
            </span>

            <strong>
              ${
                formatNumber(
                  p.population_jobs_half
                )
              }
            </strong>

          </div>


          <div class="popup-stat">

            <span>
              Housing units
            </span>

            <strong>
              ${
                formatNumber(
                  p.housing_units_half
                )
              }
            </strong>

          </div>

        </div>


        <div class="popup-section">

          <div class="popup-section-title">
            Building coverage
          </div>


          <div class="popup-stat">

            <span>
              ⅛ mile
            </span>

            <strong>
              ${
                formatPercent(
                  p.building_coverage_pct_eighth
                )
              }
            </strong>

          </div>


          <div class="popup-stat">

            <span>
              ¼ mile
            </span>

            <strong>
              ${
                formatPercent(
                  p.building_coverage_pct_quarter
                )
              }
            </strong>

          </div>


          <div class="popup-stat">

            <span>
              ½ mile
            </span>

            <strong>
              ${
                formatPercent(
                  p.building_coverage_pct_half
                )
              }
            </strong>

          </div>

        </div>


        <div class="popup-note">

          Population: 2020 Census.
          Jobs: 2024 LEHD LODES.
          Ridership and land-use measures use different
          source years.

        </div>

      `;

    }



    // ======================================================
    // LOAD STATIONS
    // ======================================================

    fetch(
      "stations.geojson"
    )

      .then(
        response => {

          if (!response.ok) {

            throw new Error(
              "Could not load stations.geojson"
            );

          }

          return response.json();

        }
      )


      .then(
        data => {


          stationValues =
            {};


          Object.keys(
            metrics
          ).forEach(
            metricKey => {

              const field =
                metrics[
                  metricKey
                ].field;


              stationValues[
                metricKey
              ] =

                data.features

                  .map(
                    feature =>
                      Number(
                        feature
                          .properties[
                            field
                          ]
                      )
                  )

                  .filter(
                    value =>
                      Number.isFinite(
                        value
                      ) &&
                      value >= 0
                  );

            }
          );


          stationLayer =
            L.geoJSON(
              data,
              {

                pane:
                  "stationPane",


                pointToLayer: function(
                  feature,
                  latlng
                ) {

                  const p =
                    feature.properties;


                  const config =
                    metrics[
                      activeMetric
                    ];


                  return L.circleMarker(
                    latlng,
                    {

                      pane:
                        "stationPane",

                      radius:
                        getRadius(
                          p[
                            config.field
                          ],
                          activeMetric
                        ),

                      fillColor:
                        "#F7F3EC",

                      color:
                        "#3F3A35",

                      weight:
                        1.5,

                      opacity:
                        1,

                      fillOpacity:
                        0.96

                    }
                  );

                },


                onEachFeature: function(
                  feature,
                  layer
                ) {

                  const p =
                    feature.properties;


                  layer.bindPopup(
                    buildPopup(
                      p
                    ),
                    {
                      maxWidth:
                        300
                    }
                  );


                  layer.on(
                    "mouseover",
                    function() {

                      this.setStyle(
                        {
                          weight:
                            2.5,

                          color:
                            "#C8643B"
                        }
                      );


                      this.bringToFront();

                    }
                  );


                  layer.on(
                    "mouseout",
                    function() {

                      this.setStyle(
                        {
                          weight:
                            1.5,

                          color:
                            "#3F3A35"
                        }
                      );

                    }
                  );

                }

              }
            ).addTo(
              map
            );


          map.fitBounds(
            stationLayer.getBounds(),
            {
              padding:
                [30, 30]
            }
          );


          const selector =
            document.getElementById(
              "metric-select"
            );


          selector.addEventListener(
            "change",
            function(
              event
            ) {

              activeMetric =
                event.target.value;


              updateStationSizes();

            }
          );


          updateLegend();

        }
      )


      .catch(
        error => {

          console.error(
            "Station layer error:",
            error
          );

        }
      );


  </script>

</body>

</html>
