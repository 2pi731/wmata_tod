  <style>

    :root {
      --background: #F7F3EC;
      --text: #282522;
      --secondary-text: #756D66;
      --border: #D8D1C8;

      --highway: #B8B1A9;

    }

      padding: 0;

   /* ======================================================

.station-info-panel {

    /* ======================================================

    /* ======================================================

    .legend-box {

    /* ======================================================

<body>

  <div id="map"></div>

  <div
    id="building-loader"
    class="building-loader"
  >
    Loading building footprints…
  </div>


  <script>


    // ======================================================
    // MAP
    // ======================================================

    const map = L.map(
      "map",
      {
        zoomControl: true,
        attributionControl: true,
        preferCanvas: true
      }
    ).setView(
      [38.92, -77.04],
      10
    );


    // ======================================================
    // PANES
    // ======================================================

    const panes = {

      water:
        200,

      county:
        250,

      minorRoad:
        290,

      highway:
        320,

      building:
        340,

      buffer:
        370,

      label:
        390,

      metro:
        420,

      station:
        600

    };


    Object.entries(
      panes
    ).forEach(
      ([name, z]) => {

        map.createPane(
          name + "Pane"
        );

        map.getPane(
          name + "Pane"
        ).style.zIndex =
          z;

      }
    );


    map.getPane(
      "labelPane"
    ).style.pointerEvents =
      "none";



    // ======================================================
    // CONSTANTS
    // ======================================================

    const BUILDING_MIN_ZOOM =
      15;


    const SECONDARY_ROAD_MIN_ZOOM =
      13;


    const LOCAL_ROAD_MIN_ZOOM =
      15;


    const COUNTY_MAX_ZOOM =
      13;


    const JURISDICTION_MAX_ZOOM =
      12;


    // ======================================================
    // GLOBAL STATE
    // ======================================================

    let activeMetric =
      "ridership";


    let activeRadius =
      "quarter";


    let selectedStationId =
      null;


    let selectedStationName =
      null;


    let stationLayer =
      null;


    let stationValues =
      {};


    let sizeLegend =
      null;


    let countyLayer =
      null;


    let secondaryRoadLayer =
      null;


    let localRoadLayer =
      null;


    let jurisdictionLayer =
      L.layerGroup();


    let buildingTileIndex =
      null;


    /*
      downloadedBuildingData:

      tile filename =>
      parsed GeoJSON

      Once fetched, a tile remains cached here even if it is
      removed from the visible map.
    */

    const downloadedBuildingData =
      new Map();


    /*
      visibleBuildingLayers:

      tile filename =>
      currently rendered Leaflet layer
    */

    const visibleBuildingLayers =
      new Map();


    const buildingRequests =
      new Map();


    let bufferData = {

      eighth:
        null,

      quarter:
        null,

      half:
        null

    };


    let selectedBufferLayer =
      null;


    let selectedBufferFeature =
      null;


    let buildingMoveTimer =
      null;


    // ======================================================
    // FORMATTERS
    // ======================================================

    function formatNumber(
      value
    ) {

      const number =
        Number(value);


      if (
        value === null ||
        value === undefined ||
        value === "" ||
        Number.isNaN(number)
      ) {

        return "—";

      }


      return number.toLocaleString(
        "en-US",
        {
          maximumFractionDigits:
            0
        }
      );

    }


    function formatPercent(
      value
    ) {

      const number =
        Number(value);


      if (
        value === null ||
        value === undefined ||
        value === "" ||
        Number.isNaN(number)
      ) {

        return "—";

      }


      return (
        number.toLocaleString(
          "en-US",
          {
            minimumFractionDigits:
              1,

            maximumFractionDigits:
              1
          }
        ) +
        "%"
      );

    }


    function formatMetricValue(
      value,
      metricKey
    ) {

      if (
        metrics[
          metricKey
        ].format ===
        "percent"
      ) {

        return formatPercent(
          value
        );

      }


      return formatNumber(
        value
      );

    }



    // ======================================================
    // STATION SIZE
    // ======================================================

    function getRadius(
      value,
      metricKey
    ) {

      const number =
        Number(value) || 0;


      const values =
        stationValues[
          metricKey
        ] || [];


      if (
        values.length === 0
      ) {

        return 4;

      }


      const maxValue =
        Math.max(
          ...values
        );


      if (
        maxValue <= 0
      ) {

        return 4;

      }


      const minRadius =
        3.5;


      const maxRadius =
        14;


      const ratio =
        Math.max(
          0,
          number / maxValue
        );


      return (
        minRadius +
        Math.sqrt(
          ratio
        ) *
        (
          maxRadius -
          minRadius
        )
      );

    }



    // ======================================================
    // SIMPLE BBOX INTERSECTION
    // ======================================================

    function boundsIntersect(
      a,
      b
    ) {

      return !(
        a.getWest() >
          b.getEast() ||

        a.getEast() <
          b.getWest() ||

        a.getSouth() >
          b.getNorth() ||

        a.getNorth() <
          b.getSouth()
      );

    }



    // ======================================================
    // POINT IN POLYGON HELPERS
    //
    // Used to visually highlight buildings whose representative
    // point lies inside the selected station buffer.
    //
    // For visualization this is substantially faster than
    // full browser-side polygon intersection.
    // ======================================================

    function pointInRing(
      point,
      ring
    ) {

      const x =
        point[0];


      const y =
        point[1];


      let inside =
        false;


      for (
        let i = 0,
        j = ring.length - 1;

        i < ring.length;

        j = i++
      ) {

        const xi =
          ring[i][0];


        const yi =
          ring[i][1];


        const xj =
          ring[j][0];


        const yj =
          ring[j][1];


        const intersect =
          (
            (
              yi > y
            ) !==
            (
              yj > y
            )
          ) &&
          (
            x <
            (
              (
                xj - xi
              ) *
              (
                y - yi
              )
            ) /
            (
              yj - yi
            ) +
            xi
          );


        if (
          intersect
        ) {

          inside =
            !inside;

        }

      }


      return inside;

    }


    function pointInPolygonCoordinates(
      point,
      coordinates
    ) {

      if (
        !coordinates ||
        coordinates.length === 0
      ) {

        return false;

      }


      if (
        !pointInRing(
          point,
          coordinates[0]
        )
      ) {

        return false;

      }


      /*
        Holes:
        if point lies inside any interior ring,
        treat it as outside.
      */

      for (
        let i = 1;

        i < coordinates.length;

        i++
      ) {

        if (
          pointInRing(
            point,
            coordinates[i]
          )
        ) {

          return false;

        }

      }


      return true;

    }


    function pointInGeoJSONFeature(
      point,
      feature
    ) {

      if (
        !feature ||
        !feature.geometry
      ) {

        return false;

      }


      const geometry =
        feature.geometry;


      if (
        geometry.type ===
        "Polygon"
      ) {

        return pointInPolygonCoordinates(
          point,
          geometry.coordinates
        );

      }


      if (
        geometry.type ===
        "MultiPolygon"
      ) {

        return geometry
          .coordinates
          .some(
            polygon =>
              pointInPolygonCoordinates(
                point,
                polygon
              )
          );

      }


      return false;

    }



    // ======================================================
    // BUILDING REPRESENTATIVE POINT
    //
    // Uses bounds center for speed.
    // ======================================================

    function buildingRepresentativePoint(
      layer
    ) {

      const bounds =
        layer.getBounds();


      const center =
        bounds.getCenter();


      return [
        center.lng,
        center.lat
      ];

    }



    // ======================================================
    // BUILDING STYLE
    // ======================================================

    function buildingStyle(
      feature,
      layer
    ) {

      let selected =
        false;


      if (
        selectedBufferFeature
      ) {

        const point =
          buildingRepresentativePoint(
            layer
          );


        selected =
          pointInGeoJSONFeature(
            point,
            selectedBufferFeature
          );

      }


      if (
        selected
      ) {

        return {

          fillColor:
            "#C8643B",

          fillOpacity:
            0.60,

          color:
            "#A94E2D",

          weight:
            0.45,

          opacity:
            0.65

        };

      }


      return {

        fillColor:
          "#8F877F",

        fillOpacity:
          0.28,

        color:
          "#8F877F",

        weight:
          0,

        opacity:
          0

      };

    }



    // ======================================================
    // REFRESH BUILDING STYLES
    // ======================================================

    function refreshBuildingStyles() {

      visibleBuildingLayers.forEach(
        tileLayer => {

          tileLayer.eachLayer(
            buildingLayer => {

              buildingLayer.setStyle(
                buildingStyle(
                  buildingLayer.feature,
                  buildingLayer
                )
              );

            }
          );

        }
      );

    }



    // ======================================================
    // BUILDING TILE INDEX
    // ======================================================

    fetch(
      "building_tiles_index.geojson"
    )

      .then(
        response => {

          if (
            !response.ok
          ) {

            throw new Error(
              "Could not load building_tiles_index.geojson"
            );

          }


          return response.json();

        }
      )


      .then(
        data => {

          buildingTileIndex =
            data.features.map(
              feature => {

                const layer =
                  L.geoJSON(
                    feature
                  );


                return {

                  feature:
                    feature,

                  filename:
                    feature
                      .properties
                      .filename,

                  bounds:
                    layer
                      .getBounds()

                };

              }
            );


          updateBuildingTiles();

        }
      )


      .catch(
        error => {

          console.error(
            "Building tile index error:",
            error
          );

        }
      );



    // ======================================================
    // BUILDING LOADER UI
    // ======================================================

    function setBuildingLoader(
      visible
    ) {

      const el =
        document.getElementById(
          "building-loader"
        );


      el.style.display =
        visible
          ? "block"
          : "none";

    }



    // ======================================================
    // CREATE BUILDING TILE LAYER
    // ======================================================

    function createBuildingLayer(
      geojson
    ) {

      return L.geoJSON(
        geojson,
        {

          pane:
            "buildingPane",

          interactive:
            false,


          onEachFeature: function(
            feature,
            layer
          ) {

            layer.setStyle(
              buildingStyle(
                feature,
                layer
              )
            );

          }

        }
      );

    }



    // ======================================================
    // FETCH ONE BUILDING TILE
    // ======================================================

    async function loadBuildingTile(
      tile
    ) {

      const filename =
        tile.filename;


      if (
        visibleBuildingLayers.has(
          filename
        )
      ) {

        return;

      }


      if (
        downloadedBuildingData.has(
          filename
        )
      ) {

        const layer =
          createBuildingLayer(
            downloadedBuildingData.get(
              filename
            )
          );


        layer.addTo(
          map
        );


        visibleBuildingLayers.set(
          filename,
          layer
        );


        return;

      }


      if (
        buildingRequests.has(
          filename
        )
      ) {

        return buildingRequests.get(
          filename
        );

      }


      const request =
        fetch(
          "buildings/" +
          filename
        )

          .then(
            response => {

              if (
                !response.ok
              ) {

                throw new Error(
                  "Could not load " +
                  filename
                );

              }


              return response.json();

            }
          )


          .then(
            data => {

              downloadedBuildingData.set(
                filename,
                data
              );


              const layer =
                createBuildingLayer(
                  data
                );


              layer.addTo(
                map
              );


              visibleBuildingLayers.set(
                filename,
                layer
              );

            }
          )


          .catch(
            error => {

              console.error(
                "Building tile error:",
                filename,
                error
              );

            }
          )


          .finally(
            () => {

              buildingRequests.delete(
                filename
              );

            }
          );


      buildingRequests.set(
        filename,
        request
      );


      return request;

    }



    // ======================================================
    // UPDATE VISIBLE BUILDING TILES
    // ======================================================

    async function updateBuildingTiles() {

      if (
        !buildingTileIndex
      ) {

        return;

      }


      if (
        map.getZoom() <
        BUILDING_MIN_ZOOM
      ) {

        visibleBuildingLayers.forEach(
          layer => {

            map.removeLayer(
              layer
            );

          }
        );


        visibleBuildingLayers.clear();


        return;

      }


      /*
        Slightly padded viewport:
        avoids obvious loading at every tiny pan.
      */

      const bounds =
        map.getBounds()
          .pad(
            0.12
          );


      const neededTiles =
        buildingTileIndex.filter(
          tile =>
            boundsIntersect(
              bounds,
              tile.bounds
            )
        );


      const neededNames =
        new Set(
          neededTiles.map(
            tile =>
              tile.filename
          )
        );


      /*
        Remove rendered layers outside current padded viewport.
        Downloaded GeoJSON remains cached in memory.
      */

      visibleBuildingLayers.forEach(
        (
          layer,
          filename
        ) => {

          if (
            !neededNames.has(
              filename
            )
          ) {

            map.removeLayer(
              layer
            );


            visibleBuildingLayers.delete(
              filename
            );

          }

        }
      );


      /*
        Fetch missing visible tiles.
      */

      const pending =
        neededTiles.filter(
          tile =>
            !visibleBuildingLayers.has(
              tile.filename
            )
        );


      if (
        pending.length === 0
      ) {

        return;

      }


      setBuildingLoader(
        true
      );


      await Promise.all(
        pending.map(
          tile =>
            loadBuildingTile(
              tile
            )
        )
      );


      setBuildingLoader(
        false
      );


      refreshBuildingStyles();

    }

    function normalizeStationId(
      value
    ) {

      if (
        value === null ||

        return null;

      }


      return String(
        value
      );

    }



    // ======================================================
    // FIND BUFFER FEATURE
    // ======================================================

    function findBufferFeature(
      radiusKey,
      stationId
    ) {

      if (
        radiusKey ===
        "none"
      ) {

        return null;

      }


      const data =
        bufferData[
          radiusKey
        ];


      if (
        !data
      ) {

        return null;

      }


      const id =
        normalizeStationId(
          stationId
        );


      return (
        data.features.find(
          feature => {

            const p =
              feature.properties;


            const featureId =
              normalizeStationId(
                p.station_id ??
                p.Station_ID ??
                p.STATION_ID ??
                p.stationid
              );


            return (
              featureId === id
            );

          }
        ) ||
        null
      );

    }

    // ======================================================
    // FORMATTERS
    // ======================================================

    function formatNumber(
      value
    ) {

      const number =
        Number(value);


      if (
        value === null ||
        value === undefined ||
        value === "" ||
        Number.isNaN(
          number
        )
      ) {

        return "—";

      }


      return number.toLocaleString(
        "en-US",
        {
          maximumFractionDigits:
            0
        }
      );

    }


    function formatPercent(
      value
    ) {

      const number =
        Number(value);


      if (
        value === null ||
        value === undefined ||
        value === "" ||
        Number.isNaN(
          number
        )
      ) {

        return "—";

      }


      return (
        number.toLocaleString(
          "en-US",
          {
            minimumFractionDigits:
              1,

            maximumFractionDigits:
              1
          }
        ) +
        "%"
      );

    }


    function formatMetricValue(
      value,
      metricKey
    ) {

      if (
        metrics[
          metricKey
        ].format ===
        "percent"
      ) {

        return formatPercent(
          value
        );

      }


      return formatNumber(
        value
      );

    }



    // ======================================================
    // STATION SIZE
    // ======================================================

    function getRadius(
      value,
      metricKey
    ) {

      const number =
        Number(value) || 0;


      const values =
        stationValues[
          metricKey
        ] || [];


      if (
        values.length ===
        0
      ) {

        return 4;

      }


      const maxValue =
        Math.max(
          ...values
        );


      if (
        maxValue <= 0
      ) {

        return 4;

      }


      const minRadius =
        3.5;


      const maxRadius =
        14;


      const ratio =
        Math.max(
          0,
          number /
          maxValue
        );


      return (
        minRadius +
        Math.sqrt(
          ratio
        ) *
        (
          maxRadius -
          minRadius
        )
      );

    }

          </div>


          <div
            id="secondary-road-legend"
            class="legend-row"
            style="display:none;"
          >

            <span
              class="map-symbol symbol-road"
            ></span>

            <span>
              Secondary road
            </span>

          </div>


          <div
            id="local-road-legend"
            class="legend-row"
            style="display:none;"
          >

            <span
              class="map-symbol symbol-local-road"
            ></span>

            <span>
              Local street
            </span>

          </div>


          <div
            id="county-legend"
            class="legend-row"
          >

            <span
              class="map-symbol symbol-county"
            ></span>

            <span>
              County / city boundary
            </span>

          </div>


          <div class="legend-row">

            <span
              class="map-symbol symbol-water"
            ></span>

            <span>
              Water
            </span>

          </div>


          <div
            id="building-legend"
            class="legend-row"
            style="display:none;"
          >

            <span
              class="map-symbol symbol-building"
            ></span>

            <span>
              Building footprint
            </span>

          </div>


          <div
            id="selected-building-legend"
            class="legend-row"
            style="display:none;"
          >

            <span
              class="map-symbol symbol-selected-building"
            ></span>

            <span>
              Inside selected area
            </span>

          </div>

        `;


        return div;

      };


    mapLegend.addTo(
      map
    );



    // ======================================================
    // LEGEND VISIBILITY
    // ======================================================

    function updateMapLegend() {

      const zoom =
        map.getZoom();


      const secondary =
        document.getElementById(
          "secondary-road-legend"
        );


      const local =
        document.getElementById(
          "local-road-legend"
        );


      const county =
        document.getElementById(
          "county-legend"
        );


      const building =
        document.getElementById(
          "building-legend"
        );


      const selected =
        document.getElementById(
          "selected-building-legend"
        );


      if (
        secondary
      ) {

        secondary.style.display =
          zoom >=
          SECONDARY_ROAD_MIN_ZOOM

            ? "flex"

            : "none";

      }


      if (
        local
      ) {

        local.style.display =
          zoom >=
          LOCAL_ROAD_MIN_ZOOM

            ? "flex"

            : "none";

      }


      if (
        county
      ) {

        county.style.display =
          zoom <=
          COUNTY_MAX_ZOOM

            ? "flex"

            : "none";

      }


      if (
        building
      ) {

        building.style.display =
          zoom >=
          BUILDING_MIN_ZOOM

            ? "flex"

            : "none";

      }


      if (
        selected
      ) {

        selected.style.display =
          (
            zoom >=
            BUILDING_MIN_ZOOM
          ) &&
          (
            selectedStationId !==
            null
          ) &&
          (
            activeRadius !==
            "none"
          )

            ? "flex"

            : "none";

      }

    }



    // ======================================================
    // POPUP
    // ======================================================

    function buildPopup(
      p
    ) {

      return `

        <div class="station-popup-name">
          ${p.Station_Name}
        </div>

        <div class="station-popup-state">
          ${p.State || ""}
        </div>


        <div class="popup-section">

          <div class="popup-section-title">
            Metrorail use
          </div>


          <div class="popup-stat">

            <span>
              Average daily entries
            </span>

            <strong>
              ${
                formatNumber(
                  p.avg_daily_entries_7day
                )
              }
            </strong>

          </div>


          <div class="popup-stat">

            <span>
              Average weekday entries
            </span>

            <strong>
              ${
                formatNumber(
                  p.avg_daily_entries_weekday
                )
              }
            </strong>

          </div>

        </div>


        <div class="popup-section">

          <div class="popup-section-title">
            Within ¼ mile
          </div>


          <div class="popup-stat">

            <span>
              Residents
            </span>

            <strong>
              ${
                formatNumber(
                  p.population_quarter
                )
              }
            </strong>

          </div>


          <div class="popup-stat">

            <span>
              Jobs
            </span>

            <strong>
              ${
                formatNumber(
                  p.jobs_quarter
                )
              }
            </strong>

          </div>


          <div
            class="
              popup-stat
              popup-stat-total
            "
          >

            <span>
              Residents + jobs
            </span>

            <strong>
              ${
                formatNumber(
                  p.population_jobs_quarter
                )
              }
            </strong>

          </div>


          <div class="popup-stat">

            <span>
              Housing units
            </span>

            <strong>
              ${
                formatNumber(
                  p.housing_units_quarter
                )
              }
            </strong>

          </div>

        </div>


        <div class="popup-section">

          <div class="popup-section-title">
            Within ½ mile
          </div>


          <div class="popup-stat">

            <span>
              Residents
            </span>

            <strong>
              ${
                formatNumber(
                  p.population_half
                )
              }
            </strong>

          </div>


          <div class="popup-stat">

            <span>
              Jobs
            </span>

            <strong>
              ${
                formatNumber(
                  p.jobs_half
                )
              }
            </strong>

          </div>


          <div
            class="
              popup-stat
              popup-stat-total
            "
          >

            <span>
              Residents + jobs
            </span>

            <strong>
              ${
                formatNumber(
                  p.population_jobs_half
                )
              }
            </strong>

          </div>


          <div class="popup-stat">

            <span>
              Housing units
            </span>

            <strong>
              ${
                formatNumber(
                  p.housing_units_half
                )
              }
            </strong>

          </div>

        </div>


        <div class="popup-section">

          <div class="popup-section-title">
            Building coverage
          </div>


          <div class="popup-stat">

            <span>
              ⅛ mile
            </span>

            <strong>
              ${
                formatPercent(
                  p.building_coverage_pct_eighth
                )
              }
            </strong>

          </div>


          <div class="popup-stat">

            <span>
              ¼ mile
            </span>

            <strong>
              ${
                formatPercent(
                  p.building_coverage_pct_quarter
                )
              }
            </strong>

          </div>


          <div class="popup-stat">

            <span>
              ½ mile
            </span>

            <strong>
              ${
                formatPercent(
                  p.building_coverage_pct_half
                )
              }
            </strong>

          </div>

        </div>


        <div class="popup-note">

          Population: 2020 Census.
          Jobs: 2024 LEHD LODES.
          Ridership and land-use measures use
          different source years.

        </div>

      `;

    }



    // ======================================================
    // STATIONS
    // ======================================================

    fetch(
      "stations.geojson"
    )

      .then(
        response =>
          response.json()
      )

      .then(
        data => {


          stationValues =
            {};


          Object.keys(
            metrics
          ).forEach(
            metricKey => {

              const field =
                metrics[
                  metricKey
                ].field;


              stationValues[
                metricKey
              ] =

                data.features

                  .map(
                    feature =>
                      Number(
                        feature
                          .properties[
                            field
                          ]
                      )
                  )

                  .filter(
                    value =>
                      Number.isFinite(
                        value
                      ) &&
                      value >= 0
                  );

            }
          );


          stationLayer =
            L.geoJSON(
              data,
              {

                pane:
                  "stationPane",


                pointToLayer: function(
                  feature,
                  latlng
                ) {

                  const p =
                    feature.properties;


                  const config =
                    metrics[
                      activeMetric
                    ];


                  return L.circleMarker(
                    latlng,
                    {

                      pane:
                        "stationPane",

                      radius:
                        getRadius(
                          p[
                            config.field
                          ],
                          activeMetric
                        ),

                      fillColor:
                        "#F7F3EC",

                      color:
                        "#3F3A35",

                      weight:
                        1.5,

                      opacity:
                        1,

                      fillOpacity:
                        0.96

                    }
                  );

                },


                onEachFeature: function(
                  feature,
                  layer
                ) {

                  const p =
                    feature.properties;


                  layer.on(
                    "click",
                    function(
                      event
                    ) {

                      selectStation(
                        p,
                        event.latlng
                      );

                    }
                  );


                  layer.on(
                    "mouseover",
                    function() {

                      this.setStyle(
                        {

                          weight:
                            2.5,

                          color:
                            "#C8643B"

                        }
                      );


                      this.bringToFront();

                    }
                  );


                  layer.on(
                    "mouseout",
                    function() {

                      this.setStyle(
                        {

                          weight:
                            1.5,

                          color:
                            "#3F3A35"

                        }
                      );

                    }
                  );

                }

              }
            ).addTo(
              map
            );


          map.fitBounds(
            stationLayer.getBounds(),
            {
              padding:
                [30, 30]
            }
          );


          const selector =
            document.getElementById(
              "metric-select"
            );


          selector.addEventListener(
            "change",
            function(
              event
            ) {

              activeMetric =
                event.target.value;


              updateStationSizes();

            }
          );


          updateSizeLegend();

          updateContextVisibility();

          updateMapLegend();

        }
      );



    // ======================================================
    // UPDATE STATION SIZES
    // ======================================================

    function updateStationSizes() {

      if (
        !stationLayer
      ) {

        return;

      }


      const config =
        metrics[
          activeMetric
        ];


      stationLayer.eachLayer(
        layer => {

          const p =
            layer.feature.properties;


          layer.setRadius(
            getRadius(
              p[
                config.field
              ],
              activeMetric
            )
          );

        }
      );


      const description =
        document.getElementById(
          "metric-description"
        );


      if (
        description
      ) {

        description.textContent =
          config.description;

      }


      updateSizeLegend();

    }



    // ======================================================
    // MAP EVENT HANDLERS
    // ======================================================

    map.on(
      "zoomend",
      function() {

        updateContextVisibility();

        updateMapLegend();

        scheduleBuildingUpdate();

      }
    );


    map.on(
      "moveend",
      function() {

        scheduleBuildingUpdate();

      }
    );


    // ======================================================
    // INITIAL CONTEXT
    // ======================================================

    jurisdictionLayer.addTo(
      map
    );


    updateContextVisibility();

    updateMapLegend();


  </script>

</body>

</html>
